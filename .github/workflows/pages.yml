name: Validate Fasting Tracker release

on:
  workflow_run:
    workflows: ["Fasting Tracker regression checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build app shell and refresh release hashes
        run: |
          python tools/build_app_shell.py
          python tools/build_i18n_runtime.py
          python tools/export_i18n_source.py
          python tools/build_release.py
      - name: Validate release metadata and hashes
        run: python tools/build_release.py --check
      - name: Run release gate
        run: python tests/test_release.py
      - name: Prepare and validate Pages artifact
        run: |
          python tools/prepare_pages.py
          test -f _site/index.html
          test -f _site/version.json
      - name: Upload validated Pages artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: fasting-tracker-pages-validation-${{ github.run_attempt }}
          path: _site
          retention-days: 7
