name: Validate and deploy Fasting Tracker

on:
  workflow_run:
    workflows: ["Fasting Tracker regression checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build app shell and refresh release hashes
        run: |
          python tools/build_app_shell.py
          python tools/build_i18n_runtime.py
          python tools/export_i18n_source.py
          python tools/build_release.py
      - name: Validate release metadata and hashes
        run: python tools/build_release.py --check
      - name: Run release gate
        run: python tests/test_release.py
      - name: Prepare Pages artifact
        run: python tools/prepare_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
