name: Fasting Tracker regression checks
on:
  push:
    branches:
      - fix/data-protection-readable-backups
      - fix/v1.12.9-calendar-day-precision
      - fix/v1.12.9-gap-duration-display
      - fix/v1.13.1-timeline-month-axis
      - feat/global-time-zones-dst
      - fix/timezone-picker-weight-units-v1.13.3
      - fix/timezone-search-selection-v1.13.4
      - feat/dst-change-indicators-v1.13.5
      - fix/palette-hints-integrity-stats-v1.17.35
      - refactor/storage-recovery-service-v1.17.38
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify atomized app-shell sources
        run: |
          python3 tools/build_app_shell.py
          python3 tools/build_app_shell.py --check
      - name: Build consistent localization and release assets in runner
        run: |
          python3 tools/build_app_shell.py
          python3 tools/build_i18n_runtime.py
          python3 tools/export_i18n_source.py
          python3 tools/build_release.py
      - name: Verify all release integrity hashes and metadata
        run: python3 tools/build_release.py --check
      - name: Run release integrity and data safeguards regression
        run: |
          git diff --exit-code -- tests
          python3 tests/test_app_shell_atomization.py
          python3 tests/test_release.py
          python3 tests/test_release_protocol_v11717.py
          python3 tests/test_timeline_month_axis.py
          python3 tests/test_accessibility_theme_contrast.py
          python3 tests/test_release_health_metadata.py
          python3 tests/test_changelog_unique_versions.py
          python3 tests/test_palette_hint_initialization.py
      - name: Validate GitHub Pages artifact preparation without deployment
        run: |
          python3 tools/prepare_pages.py
          test -f _site/index.html
          test -f _site/version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          version=json.loads((root/'version.json').read_text())
          assert version['version']==json.loads(Path('version.json').read_text())['version']
          assert all((root/name).exists() for name in ('index.html','about.html','privacy.html','branding.html','license.html','changelog.html'))
          print('PASS: GitHub Pages build artifact and required documents')
          PY
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          sudo ln -sf "$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/chromium
      - name: Execute backup restore and safe-merge browser tests
        run: |
          python3 tests/test_indexeddb_storage_reliability.py
          python3 tests/test_corruption_recovery_simulations.py
          python3 tests/test_storage_loss_recovery.py
          python3 tests/test_record_storage_architecture.py
          python3 tests/test_startup_snapshot.py
          python3 tests/test_soft_delete_audit.py
          python3 tests/test_weight_soft_delete.py
          python3 tests/test_backup_version_restore_matrix.py
          python3 tests/test_import_preview_merge.py
          python3 tests/test_destructive_guard.py
          python3 tests/test_permanent_purge_confirmation.py
          python3 tests/test_backup_indicator.py
          python3 tests/test_setup_notification_layout.py
          python3 tests/test_notifications.py
          python3 tests/test_notification_details_v1120.py
          python3 tests/test_dst_timezone.py
          python3 tests/test_weight_unit_layout.py
          python3 tests/test_weight_aggregation_scroll.py
          python3 tests/test_weight_navigator_pointer_drag.py
          python3 tests/test_weight_chart_touch_swipe.py
          python3 tests/test_v1178_stats_history_navigation.py
          python3 tests/test_fasting_encouragement_v1179.py
      - name: Execute statistics performance regression
        run: python3 tests/test_performance.py
      - name: Execute extended migration, accessibility and lifetime performance regressions
        run: |
          python3 tests/test_migration_matrix.py
          python3 tests/test_datetime_edges_v1111.py
          python3 tests/test_chart_accessibility.py
          python3 tests/test_stats_chart_keyboard_accessibility.py
          python3 tests/test_modal_focus_management.py
          python3 tests/test_storage_health_diagnostics.py
          python3 tests/test_lifetime_performance.py
          python3 tests/test_repository_cleanliness_v1115.py
      - name: Check application JavaScript and document navigation
        run: |
          node tests/v1123-regression.cjs
          node tests/test_platform_diagnostics.cjs
          node tests/test_integrity_primitives.cjs
          node tests/test_analytics.cjs
          node tests/test_time_primitives.cjs
      - name: Verify release archive
        run: |
          python3 - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path
          tracked = [Path(raw.decode('utf-8')) for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if raw]
          tracked.sort()
          assert tracked, 'No tracked source files found'
          assert all(path.is_file() for path in tracked), 'A tracked file is missing'
          assert not any('_site' in path.parts or '__pycache__' in path.parts or path.suffix == '.pyc' for path in tracked)
          release_version = json.loads(Path('version.json').read_text())['version']
          archive = Path(f'/tmp/fasting-tracker-v{release_version}.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in tracked:
                  z.write(path, path.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Invalid ZIP member'
              names = z.namelist()
              assert len(names) == len(set(names)) == len(tracked), 'Archive member count mismatch'
              assert set(names) == {path.as_posix() for path in tracked}, 'Archive differs from Git-tracked source'
              assert {'.github/workflows/pages.yml', '.github/workflows/v1123-regression.yml', 'index.html', 'version.json', 'about.html', 'privacy.html', 'branding.html', 'license.html', 'changelog.html', 'CHANGELOG.md'} <= set(names)
              assert json.loads(z.read('version.json'))['version'] == release_version
              print(f'PASS: complete clean GitHub Desktop ZIP ({len(names)} tracked source files)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fasting-tracker-regression-release
          path: /tmp/fasting-tracker-v*.zip
          retention-days: 14

  sync-generated-assets:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild committed localization and release metadata
        run: |
          python3 tools/build_app_shell.py
          python3 tools/build_i18n_runtime.py
          python3 tools/export_i18n_source.py
          python3 tools/build_release.py
      - name: Commit generated release assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n-source.json i18n/en.js i18n/bg.js i18n/es.js version.json index.html about.html privacy.html branding.html license.html changelog.html CHANGELOG.md README.md
          if ! git diff --cached --quiet; then
            git commit -m "build(release): synchronize generated localization and release assets"
            git push origin main
          fi
