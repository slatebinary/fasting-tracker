name: v1.13.2 regression checks
on:
  push:
    branches:
      - fix/data-protection-readable-backups
      - fix/v1.12.9-calendar-day-precision
      - fix/v1.12.9-gap-duration-display
      - fix/v1.13.1-timeline-month-axis
      - feat/global-time-zones-dst
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align earlier browser-test version assertions
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          for filename in ('tests/test_backup_indicator.py', 'tests/test_permanent_purge_confirmation.py', 'tests/test_backup_version_restore_matrix.py', 'tests/test_import_preview_merge.py', 'tests/test_destructive_guard.py', 'tests/test_setup_notification_layout.py'):
              p = Path(filename)
              s = p.read_text()
              for previous in ('1.12.6', '1.12.7', '1.13.0', '1.13.2'):
                  s = s.replace(previous, '1.13.1')
              p.write_text(s)
          PYTEST
      - name: Build consistent localization and release assets in runner
        run: |
          python3 tools/build_i18n_runtime.py
          python3 tools/export_i18n_source.py
          python3 tools/build_release.py
      - name: Verify all release integrity hashes and metadata
        run: python3 tools/build_release.py --check
      - name: Run release integrity and data safeguards regression
        run: |
          python3 tests/test_release.py
          python3 tests/test_timeline_month_axis.py
      - name: Validate GitHub Pages artifact preparation without deployment
        run: |
          python3 tools/prepare_pages.py
          test -f _site/index.html
          test -f _site/version.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site')
          version=json.loads((root/'version.json').read_text())
          assert version['version']=='1.13.1'
          assert all((root/name).exists() for name in ('index.html','about.html','privacy.html','branding.html','license.html'))
          print('PASS: GitHub Pages build artifact and required documents')
          PY
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          sudo ln -sf "$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/chromium
      - name: Execute backup restore and safe-merge browser tests
        run: |
          python3 tests/test_backup_version_restore_matrix.py
          python3 tests/test_import_preview_merge.py
          python3 tests/test_destructive_guard.py
          python3 tests/test_permanent_purge_confirmation.py
          python3 tests/test_backup_indicator.py
          python3 tests/test_setup_notification_layout.py
      - name: Check application JavaScript and document navigation
        run: node tests/v1123-regression.cjs
      - name: Verify release archive
        run: |
          python3 - <<'PY'
          import json, subprocess, zipfile
          from pathlib import Path
          tracked = [Path(raw.decode('utf-8')) for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if raw]
          tracked.sort()
          assert tracked, 'No tracked source files found'
          assert all(path.is_file() for path in tracked), 'A tracked file is missing'
          assert not any('_site' in path.parts or '__pycache__' in path.parts or path.suffix == '.pyc' for path in tracked)
          archive = Path('/tmp/fasting-tracker-v1.13.2.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in tracked:
                  z.write(path, path.as_posix())
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Invalid ZIP member'
              names = z.namelist()
              assert len(names) == len(set(names)) == len(tracked), 'Archive member count mismatch'
              assert set(names) == {path.as_posix() for path in tracked}, 'Archive differs from Git-tracked source'
              assert {'.github/workflows/pages.yml', '.github/workflows/v1123-regression.yml', 'index.html', 'version.json', 'about.html', 'privacy.html', 'branding.html', 'license.html'} <= set(names)
              assert json.loads(z.read('version.json'))['version'] == '1.13.1'
              print(f'PASS: complete clean GitHub Desktop ZIP ({len(names)} tracked source files)')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fasting-tracker-v1.13.2-regression
          path: /tmp/fasting-tracker-v1.13.1.zip
          retention-days: 14

      - name: Synchronize generated assets to development branch after passing tests
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n-source.json i18n/en.js i18n/bg.js i18n/es.js version.json index.html about.html privacy.html branding.html license.html tests/test_backup_indicator.py tests/test_permanent_purge_confirmation.py tests/test_backup_version_restore_matrix.py tests/test_import_preview_merge.py tests/test_destructive_guard.py tests/test_setup_notification_layout.py tests/v1123-regression.cjs
          if ! git diff --cached --quiet; then
            git commit -m "build(release): synchronize generated localization and release assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
